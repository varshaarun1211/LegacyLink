{% extends "base.html" %}
{% block title %}Log in | LegacyLink{% endblock %}
{% block content %}
<section class="form-area"><div class="form-card">
 <p class="eyebrow">Welcome back</p><h1>Log in to LegacyLink</h1><p class="muted">Sign in to continue connecting with your alumni community.</p>
 
<form method="POST" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>
        Email address
        <input
            type="email"
            name="email"
            autocomplete="email"
            required
        >
    </label>

    <label>
        Password
        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >
    </label>

    <button class="button" type="submit">Log in</button>
</form>

 <p class="center muted">New to LegacyLink? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></section>
{% endblock %}
