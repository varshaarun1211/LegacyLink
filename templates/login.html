{% extends "base.html" %}
{% block title %}Log in | LegacyLink{% endblock %}
{% block content %}
<section class="form-area">
  <div class="form-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Log in to LegacyLink</h1>
    <p class="muted">Sign in to continue connecting with your alumni community.</p>
    <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email address
        <input name="email" type="email" autocomplete="email" required maxlength="255">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="button full-button" type="submit">Log in</button>
    </form>
    <p class="center muted">New to LegacyLink? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
