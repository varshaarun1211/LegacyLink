{% extends "base.html" %}
{% block title %}Log in | LegacyLink{% endblock %}
{% block content %}
<section class="form-area"><div class="form-card">
 <p class="eyebrow">Welcome back</p><h1>Log in to LegacyLink</h1><p class="muted">Sign in to continue connecting with your alumni community.</p>
 <form data-api-form="/api/login" data-success="Signed in successfully." novalidate>
  <label>Email address<input name="email" type="email" autocomplete="email" required><small class="field-error" data-error-for="email"></small></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required><small class="field-error" data-error-for="password"></small></label>
  <button class="button full-button" type="submit">Log in</button><p class="form-status" role="status" aria-live="polite"></p>
 </form>
 <p class="center muted">New to LegacyLink? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></section>
{% endblock %}
