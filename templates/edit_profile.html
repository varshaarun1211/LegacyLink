
{% extends "base.html" %}

{% block title %}Edit Profile | LegacyLink{% endblock %}

{% block content %}
<div class="panel">
    <h1>Edit Your Profile</h1>
    <p class="muted">Update your alumni information.</p>

    <form method="POST" action="{{ url_for('edit_profile') }}">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Full Name *</label>
        <input type="text" name="full_name" maxlength="150"
               value="{{ profile.full_name }}" required>

        <label>Department *</label>
        <input type="text" name="department" maxlength="120"
               value="{{ profile.department }}" required>

        <label>Degree *</label>
        <input type="text" name="degree" maxlength="120"
               value="{{ profile.degree }}" required>

        <label>Graduation Year *</label>
        <input type="number" name="graduation_year"
               min="1900" max="2026"
               value="{{ profile.graduation_year }}" required>

        <label>Occupation</label>
        <input type="text" name="occupation" maxlength="150"
               value="{{ profile.occupation or '' }}">

        <label>Company</label>
        <input type="text" name="company" maxlength="150"
               value="{{ profile.company or '' }}">

        <label>Skills</label>
        <textarea name="skills" maxlength="1000"
                  rows="3">{{ profile.skills or '' }}</textarea>

        <label>About Me</label>
        <textarea name="bio" maxlength="2000"
                  rows="5">{{ profile.bio or '' }}</textarea>

        <label>
            <input type="checkbox" name="is_visible"
                   style="width:auto"
                   {% if profile.is_visible %}checked{% endif %}>
            Show my profile in the alumni directory
        </label>

        <br><br>
        <button type="submit">Save Changes</button>
        <a class="button secondary"
           href="{{ url_for('alumni_profile', id=profile.id) }}">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
