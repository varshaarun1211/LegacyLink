<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LegacyLink helps alumni stay connected and grow together.">
  <title>{% block title %}LegacyLink{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">L</span> LegacyLink</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" class="nav" aria-label="Main navigation">
      <a href="{{ url_for('index') }}#how-it-works">How it works</a>
      <a href="{{ url_for('alumni_directory') }}">Alumni directory</a>
      <a href="{{ url_for('login') }}">Log in</a>
      <a class="button button-small" href="{{ url_for('register') }}">Join the network</a>
    </nav>
  </div>
</header>
<main id="main">{% block content %}{% endblock %}</main>
<footer class="footer">
  <div class="container footer-inner">
    <a class="brand brand-light" href="{{ url_for('index') }}"><span class="brand-mark">L</span> LegacyLink</a>
    <p>Connections that last. Legacies that grow.</p>
    <small>A community for alumni to reconnect, share, and support one another.</small>
  </div>
</footer>
</body>
</html>
