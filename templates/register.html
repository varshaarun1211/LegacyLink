
{% extends "base.html" %}
{% block title %}Join LegacyLink{% endblock %}

{% block content %}
<section class="form-area">
    <div class="form-card wide">

        <p class="eyebrow">Create your account</p>
        <h1>Join the network</h1>

        <p class="muted">
            Your registration will be reviewed before your profile appears in the directory.
        </p>

        <p class="notice">Fields marked * are required.</p>

        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-grid">

                <label>
                    Full name *
                    <input
                        name="full_name"
                        type="text"
                        autocomplete="name"
                        value="{{ form.get('full_name', '') }}"
                        required
                        minlength="2"
                        maxlength="150"
                    >
                </label>

                <label>
                    Email address *
                    <input
                        name="email"
                        type="email"
                        autocomplete="email"
                        value="{{ form.get('email', '') }}"
                        required
                    >
                </label>

                <label>
                    Password *
                    <input
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small class="help">At least 8 characters.</small>
                </label>

                <label>
                    Confirm password *
                    <input
                        name="confirm_password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </label>

                <label>
                    Department *
                    <input
                        name="department"
                        value="{{ form.get('department', '') }}"
                        required
                        maxlength="120"
                    >
                </label>

                <label>
                    Degree *
                    <input
                        name="degree"
                        value="{{ form.get('degree', '') }}"
                        required
                        maxlength="120"
                    >
                </label>

                <label>
                    Graduation year *
                    <input
                        name="graduation_year"
                        type="number"
                        min="1900"
                        max="2026"
                        value="{{ form.get('graduation_year', '') }}"
                        required
                    >
                </label>

                <label>
                    Occupation (optional)
                    <input
                        name="occupation"
                        value="{{ form.get('occupation', '') }}"
                        maxlength="150"
                    >
                </label>

                <label>
                    Company (optional)
                    <input
                        name="company"
                        value="{{ form.get('company', '') }}"
                        maxlength="150"
                    >
                </label>

                <label class="full">
                    Skills (optional)
                    <input
                        name="skills"
                        value="{{ form.get('skills', '') }}"
                        placeholder="For example: design, research, finance"
                    >
                </label>

                <label class="full">
                    Short bio (optional)
                    <textarea name="bio" rows="4" maxlength="2000">{{ form.get('bio', '') }}</textarea>
                </label>

            </div>

            <button class="button" type="submit">Create account</button>

        </form>

        <p class="center muted">
            Already registered?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>

    </div>
</section>
{% endblock %}
