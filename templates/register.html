{% extends "base.html" %}
{% block title %}Join LegacyLink{% endblock %}
{% block content %}
<section class="form-area">
  <div class="form-card wide">
    <p class="eyebrow">Create your account</p>
    <h1>Join the network</h1>
    <p class="muted">Your registration will be reviewed before your profile appears in the directory.</p>
    <p class="notice">Fields marked * are required.</p>

    <form method="post" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <label>Full name *
          <input name="full_name" autocomplete="name" required minlength="2" maxlength="150" value="{{ form.get('full_name', '') }}">
        </label>
        <label>Email address *
          <input name="email" type="email" autocomplete="email" required maxlength="255" value="{{ form.get('email', '') }}">
        </label>
        <label>Password *
          <input name="password" type="password" autocomplete="new-password" required minlength="8">
          <small class="help">Use at least 8 characters.</small>
        </label>
        <label>Confirm password *
          <input name="confirm_password" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <label>Department *
          <input name="department" required maxlength="120" value="{{ form.get('department', '') }}">
        </label>
        <label>Degree *
          <input name="degree" required maxlength="120" value="{{ form.get('degree', '') }}">
        </label>
        <label>Graduation year *
          <input name="graduation_year" type="number" min="1900" required value="{{ form.get('graduation_year', '') }}">
        </label>
        <label>Occupation (optional)
          <input name="occupation" maxlength="150" value="{{ form.get('occupation', '') }}">
        </label>
        <label>Company (optional)
          <input name="company" maxlength="150" value="{{ form.get('company', '') }}">
        </label>
        <label class="full">Skills (optional)
          <textarea name="skills" rows="3" maxlength="1000">{{ form.get('skills', '') }}</textarea>
        </label>
        <label class="full">Short bio (optional)
          <textarea name="bio" rows="4" maxlength="2000">{{ form.get('bio', '') }}</textarea>
        </label>
      </div>
      <button class="button" type="submit">Create account</button>
    </form>
    <p class="center muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
